<title>Hatch Демо-ролик</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Кадр 1600×900 (16:9), масштабируется под окно. Тёмная тема Hatch — единственная: ролик снимается в ней. */
:root {
  color-scheme: dark;
  --page: #0e0f13;
  --ink: #f2f3f7;
  --ink2: #a3a8b4;
  --accent: #0a84ff;
  --search: #ff9f0a;
  --star: #ffd60a;
  --win: #2a2a2d;
  --sect: #222224;
  --field: #1d1d1f;
  --fg: #e6e6ea;
  --fg2: #9a9aa1;
  --fg3: #6c6c73;
  --raise: linear-gradient(180deg, #505055, #3c3c40);
  --raise-edge: #5b5b61;
  --raise-under: #18181a;
  --well: #212123;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--page); color: var(--ink); font: 14px var(--ui); display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: hidden }
body.rec { padding: 0; gap: 0; justify-content: center; overflow: hidden }

.fit { width: 100%; max-width: 1600px; position: relative }
.fit::before { content: ""; display: block; padding-top: 56.25% }
body.rec .fit { max-width: none; width: 100vw; height: 100vh }
body.rec .fit::before { display: none }
#film { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden; border-radius: 14px;
  background:
    radial-gradient(55% 60% at 18% 22%, #27406b 0%, transparent 70%),
    radial-gradient(50% 55% at 86% 80%, #4a2f63 0%, transparent 70%),
    radial-gradient(40% 40% at 70% 15%, #1d4f5c 0%, transparent 70%),
    #12141a }
body.rec #film { border-radius: 0 }

/* строка меню macOS */
.menubar { position: absolute; inset: 0 0 auto; height: 30px; display: flex; align-items: center; gap: 22px; padding: 0 18px;
  background: rgba(20,22,28,.35); backdrop-filter: blur(20px); font: 500 13.5px var(--ui); color: rgba(255,255,255,.88) }
.menubar .apple { width: 14px; height: 16px; border-radius: 4px 4px 6px 6px; background: rgba(255,255,255,.85) }
.menubar .sp { flex: 1 }
.menubar .hatchglyph { width: 18px; height: 14px; border: 1.6px solid rgba(255,255,255,.9); border-radius: 4px; position: relative }
.menubar .hatchglyph::after { content: ""; position: absolute; left: 3px; right: 3px; top: 5px; height: 1.6px; background: rgba(255,255,255,.9) }

/* панель Hatch */
.pwrap { position: absolute; left: 50%; top: 66px; width: 780px; transform: translateX(-50%) scale(1.32); transform-origin: top center }
.panel { position: relative; width: 780px; background: linear-gradient(#333336, #2a2a2d); border: 1px solid #3f3f43;
  border-radius: 19px; padding: 8px; display: flex; flex-direction: column; gap: 8px; color: var(--fg); font: 13px var(--ui);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 30px 80px rgba(0,0,0,.6); opacity: 0; scale: .96; transform: translateY(-10px);
  transition: opacity .28s ease, scale .32s cubic-bezier(.3,1.3,.5,1), transform .32s cubic-bezier(.3,1.3,.5,1) }
.panel.on { opacity: 1; scale: 1; transform: none }

.crumbs { display: flex; align-items: center; gap: 4px; padding: 3px 10px 0; font: 12px var(--ui); color: var(--fg2); min-height: 22px; position: relative }
.crumb { display: inline-flex; align-items: center; gap: 5px; padding: 1px 5px; border-radius: 5px; transition: background .2s, color .2s, box-shadow .2s }
.crumb::before { content: ""; width: 13px; height: 10px; border-radius: 2px; background: linear-gradient(#6fb3ff, #3d8ef0); box-shadow: inset 0 2px 0 rgba(255,255,255,.35) }
.crumb.lit { background: rgba(10,132,255,.25); color: #fff; box-shadow: inset 0 0 0 1px rgba(10,132,255,.6) }
.crumbs .sep { color: var(--fg3); font-size: 12px }
.crumbs .fav { color: var(--star); font-size: 11px; opacity: 0; scale: .3; transition: opacity .25s, scale .35s cubic-bezier(.3,1.6,.5,1) }
.crumbs .fav.on { opacity: 1; scale: 1 }

.sunk { box-shadow: inset 0 2.6px 7px rgba(0,0,0,.5), inset 0 0 0 .5px rgba(0,0,0,.65), inset 0 -2px 3px -1px rgba(255,255,255,.06), 0 2px 3px -1px rgba(255,255,255,.1) }
.inbar { position: relative; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; background: var(--field); border-radius: 11px }
.ring::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid rgba(10,132,255,.55); pointer-events: none; opacity: 0; transition: opacity .25s, border-color .25s }
.ring.on::after { opacity: 1 }
.inbar.searching::after { border-color: rgba(255,159,10,.7); opacity: 1 }
.prompt { color: var(--fg3); font: 500 18px var(--ui); width: 14px; text-align: center }
.inbar .txt { flex: 1; min-width: 0; font: 16px var(--ui); white-space: nowrap; overflow: hidden; display: flex; align-items: center }
.inbar .txt .ph { color: var(--fg3) }
.caret { display: inline-block; width: 1.5px; height: 18px; background: var(--accent); margin-left: 1px; animation: blink 1.05s steps(1) infinite }
.searching .caret { background: var(--search) }
@keyframes blink { 50% { opacity: 0 } }
.badge { display: none; align-items: center; gap: 6px; font: 12px var(--ui); color: var(--search); background: rgba(255,159,10,.14); border: 1px solid rgba(255,159,10,.55); border-radius: 99px; padding: 2px 9px }
.searching .badge { display: inline-flex }
.ibs { display: flex; gap: 6px }
.key { display: grid; place-items: center; background: var(--raise); color: var(--fg); box-shadow: inset 0 0 0 1px var(--raise-edge), 0 2px 0 var(--raise-under); transition: translate .08s, box-shadow .08s }
.key.press { translate: 0 2px; box-shadow: inset 0 0 0 1px var(--raise-edge), 0 0 0 var(--raise-under) }
.ib { width: 28px; height: 28px; border-radius: 8px }
.ib svg, .bb svg { width: 15px; height: 15px }

.list { display: flex; flex-direction: column; gap: 8px }
.blk { background: var(--sect); border-radius: 11px; overflow: hidden; transition: opacity .35s, max-height .45s ease, margin .45s; max-height: 420px }
.blk.gone { opacity: 0; max-height: 0; margin-top: -8px }
.blk.enter { animation: blkin .45s cubic-bezier(.3,1.2,.5,1) }
@keyframes blkin { from { opacity: 0; transform: translateY(-8px) scale(.98); max-height: 0 } }
.bh { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 52px }
.tri { width: 0; height: 0; border: 4.5px solid transparent; border-left: 6px solid var(--fg2); margin: 0 -2px 0 2px }
.ttl { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 }
.cmd { font: 600 13px var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.meta { display: flex; gap: 8px; align-items: center; font: 11.5px var(--ui); color: var(--fg2) }
.meta .dir { display: inline-flex; gap: 5px; align-items: center }
.meta .dir::before { content: ""; width: 12px; height: 9px; border-radius: 2px; border: 1.2px solid var(--fg2) }
.meta .tm { color: var(--fg3); font-variant-numeric: tabular-nums }
.chips { display: flex; gap: 6px; align-items: center }
.chip { font: 11.5px var(--mono); padding: 3px 8px; border-radius: 6px; color: #d6e6ff; background: rgba(10,132,255,.32); border: .5px solid rgba(10,132,255,.8); animation: chipin .3s cubic-bezier(.3,1.5,.5,1) }
@keyframes chipin { from { opacity: 0; scale: .7 } }
.stagef { position: relative; display: flex; align-items: center; min-width: 120px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--field); font: 11.5px var(--mono); animation: chipin .25s ease }
.stagef::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid rgba(10,132,255,.55) }
.stagef .ph { color: var(--fg3) }
.stagef .caret { height: 13px }
.bb { width: 24px; height: 24px; border-radius: 7px }
.slot { position: relative; height: 26px; min-width: 140px; display: flex; justify-content: flex-end; align-items: center; perspective: 300px }
.status { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--ui); color: var(--fg2); transition: transform .38s cubic-bezier(.3,1.2,.5,1), opacity .25s; transform-origin: top }
.status .dot { width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center }
.status.ok .dot { background: #30d158 }
.status.ok .dot svg { width: 9px; height: 9px; color: #fff }
.status.run { color: #fff0c8 }
.status.run .dot { border: 2px solid rgba(255,214,102,.3); border-top-color: #ffd666; animation: spin .8s linear infinite }
@keyframes spin { to { rotate: 360deg } }
.acts { position: absolute; right: 0; display: flex; gap: 4px }
.acts .bb { opacity: 0; transform: rotateX(-75deg) translateY(8px); transform-origin: bottom; transition: transform .38s cubic-bezier(.3,1.3,.5,1), opacity .2s }
.hover .status { transform: rotateX(75deg) translateY(-8px); opacity: 0 }
.hover .acts .bb { opacity: 1; transform: none }
.hover .acts .bb:nth-child(4) { transition-delay: .035s } .hover .acts .bb:nth-child(3) { transition-delay: .07s }
.hover .acts .bb:nth-child(2) { transition-delay: .105s } .hover .acts .bb:nth-child(1) { transition-delay: .14s }
.out { margin: 0 12px 12px; padding: 9px 12px; border-radius: 8px; background: var(--field); font: 12px/1.6 var(--mono); color: #d5d5da; min-height: 20px;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.55), 0 0 0 .5px rgba(0,0,0,.6) }
.out .ln { white-space: pre; overflow: hidden; max-height: 20px; transition: max-height .4s ease, opacity .3s }
.out .ln.cut { max-height: 0; opacity: 0 }
.out .h { color: #e3b341 }
.out mark { background: rgba(10,132,255,.35); color: #fff; border-radius: 2px }
.out mark.s { background: rgba(255,159,10,.4) }
.pv { border-top: 1px solid rgba(255,255,255,.05); padding: 7px 12px 10px; font: 11.5px/1.55 var(--mono); color: #c9c9ce; white-space: pre }

/* дерево папок */
.tree { position: absolute; z-index: 4; left: 96px; top: 34px; width: 360px; background: linear-gradient(180deg, #333336, #2b2b2e); border: 1px solid #47474c; border-radius: 14px;
  box-shadow: 0 24px 50px -12px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08); overflow: hidden; animation: popin .2s cubic-bezier(.3,1.3,.5,1) }
@keyframes popin { from { opacity: 0; transform: translateY(-4px) scale(.97) } }
.tree .up { padding: 8px 12px 0; font: 11px var(--ui); color: var(--fg3) }
.tree .up b { color: var(--fg2); font-weight: 600 }
.tree .rows { padding: 6px }
.trow { display: flex; align-items: center; gap: 6px; height: 27px; padding: 0 8px 0 4px; border-radius: 8px; white-space: nowrap; font: 13px var(--ui); transition: background .12s }
.trow.sel { background: rgba(10,132,255,.22); box-shadow: inset 0 0 0 1px rgba(10,132,255,.55) }
.trow .tw { width: 16px; display: grid; place-items: center; color: var(--fg2) }
.trow .tw svg { width: 9px; height: 9px; transition: rotate .15s }
.trow .tw.open svg { rotate: 90deg }
.trow .tw.leaf { visibility: hidden }
.trow .fg { width: 15px; height: 11px; border-radius: 2px; background: linear-gradient(#6fb3ff, #3d8ef0); box-shadow: inset 0 2px 0 rgba(255,255,255,.35); margin-right: 3px }
.trow .cur { margin-left: 8px; font-size: 10.5px; color: var(--fg3) }
.tree .foot { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 7px 12px 9px; border-top: 1px solid #3d3d41; font: 11px var(--ui); color: var(--fg3) }
.tree .foot span { display: inline-flex; gap: 4px; align-items: center }
.kh { font: 600 10px var(--ui); color: var(--fg2); background: var(--well); border-radius: 4px; padding: 1px 5px; box-shadow: inset 0 1px 2px rgba(0,0,0,.6) }

.toast { position: absolute; left: 50%; bottom: -54px; translate: -50% 0; padding: 8px 14px; border-radius: 10px; background: #3a3a3d; color: var(--fg); font: 13px var(--ui);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.6), 0 8px 20px rgba(0,0,0,.5); opacity: 0; transform: translateY(8px); transition: .3s; white-space: nowrap }
.toast.on { opacity: 1; transform: none }

/* курсор */
.cursor { position: absolute; z-index: 20; left: 1700px; top: 700px; width: 22px; height: 32px; transition: left .9s cubic-bezier(.45,0,.2,1), top .9s cubic-bezier(.45,0,.2,1); filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)) }
.cursor.click svg { scale: .88 }
.cursor svg { transition: scale .1s; transform-origin: 3px 3px }

/* подписи и клавиши */
.cap { position: absolute; left: 80px; bottom: 64px; max-width: 1100px; transition: opacity .4s, transform .4s; }
.cap.hide { opacity: 0; transform: translateY(10px) }
.cap .step { font: 600 13px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: 10px }
.cap h2 { margin: 0; font: 700 46px/1.08 var(--display); letter-spacing: -.02em; text-wrap: balance }
.cap p { margin: 12px 0 0; font: 400 20px/1.4 var(--ui); color: var(--ink2); text-wrap: balance }
.hud { position: absolute; right: 80px; bottom: 70px; display: flex; gap: 10px; align-items: center }
.hud .k { min-width: 64px; height: 64px; padding: 0 18px; border-radius: 14px; display: grid; place-items: center; font: 600 26px var(--ui); color: #fff;
  background: linear-gradient(180deg, rgba(90,90,98,.92), rgba(58,58,64,.92)); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14), 0 4px 0 rgba(10,10,12,.9), 0 14px 30px rgba(0,0,0,.45);
  animation: keyin .22s cubic-bezier(.3,1.5,.5,1) }
.hud .k.down { translate: 0 3px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14), 0 1px 0 rgba(10,10,12,.9), 0 10px 24px rgba(0,0,0,.45) }
@keyframes keyin { from { opacity: 0; transform: translateY(10px) scale(.9) } }
.hud.out { opacity: 0; transition: opacity .3s }

/* финал */
.outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; opacity: 0; pointer-events: none; transition: opacity .6s }
.outro.on { opacity: 1 }
.appicon { width: 132px; height: 132px; border-radius: 30px; background: linear-gradient(160deg, #3a3a40, #1c1c20); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12), 0 30px 60px rgba(0,0,0,.55);
  display: grid; place-items: center; position: relative; transform: translateY(16px) scale(.92); transition: transform .8s cubic-bezier(.3,1.3,.5,1) }
.outro.on .appicon { transform: none }
.appicon .well { width: 86px; height: 58px; border-radius: 13px; background: #121214; box-shadow: inset 0 4px 9px rgba(0,0,0,.8), 0 1.5px 0 rgba(255,255,255,.12);
  display: flex; align-items: center; padding-left: 14px; gap: 6px; font: 700 26px var(--mono); color: #74e6ab }
.appicon .well i { width: 14px; height: 4px; background: #74e6ab; display: inline-block; margin-top: 16px; animation: blink 1.05s steps(1) infinite }
.outro h1 { margin: 0; font: 800 96px/1 var(--display); letter-spacing: -.035em }
.outro .tag { margin: 0; font: 400 26px var(--ui); color: var(--ink2) }
.outro .row { display: flex; gap: 12px; margin-top: 8px }
.outro .pill { font: 500 17px var(--ui); padding: 10px 18px; border-radius: 99px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12) }
.outro .pill.main { background: linear-gradient(180deg, #5b8fe0, #3f6fc4); box-shadow: inset 0 0 0 1px #6d9ae6, 0 3px 0 #1d2f55; color: #fff; font-weight: 600 }

/* панель управления (в записи скрыта) */
.ctl { width: 100%; max-width: 1600px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
body.rec .ctl { display: none }
.ctl button { font: 600 14px var(--ui); padding: 10px 16px; border-radius: 10px; border: 1px solid #2c303a; background: #1a1d24; color: var(--ink); cursor: pointer }
.ctl button.primary { background: var(--accent); border-color: var(--accent); color: #fff }
.ctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.ctl .bar { flex: 1; min-width: 160px; height: 4px; border-radius: 2px; background: #252933; overflow: hidden }
.ctl .bar i { display: block; height: 100%; width: 0; background: var(--accent) }
.ctl .hint { width: 100%; color: var(--ink2); font-size: 13px; line-height: 1.5 }
.ctl kbd { font: 500 12px var(--mono); border: 1px solid #2c303a; border-bottom-width: 2px; border-radius: 5px; padding: 0 5px }
@media (prefers-reduced-motion: reduce) { .caret, .appicon .well i { animation: none } }
</style>

<div class="fit" id="fit">
  <div id="film">
    <div class="menubar"><span class="apple"></span><span>Finder</span><span style="opacity:.7">Файл</span><span style="opacity:.7">Правка</span><span style="opacity:.7">Вид</span><span class="sp"></span><span class="hatchglyph"></span><span style="font-variant-numeric:tabular-nums">Чт 12:04</span></div>

    <div class="pwrap"><div class="panel" id="panel">
      <div class="crumbs" id="crumbs"></div>
      <div class="inbar sunk ring" id="inbar">
        <span class="prompt">›</span>
        <span class="txt" id="intext"></span>
        <span class="badge">Поиск <span style="font-size:10px">✕</span></span>
        <div class="ibs">
          <span class="key ib" id="favbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.9l1.85 3.8 4.15.6-3 2.95.7 4.15L8 11.45 4.3 13.4l.7-4.15-3-2.95 4.15-.6z"/></svg></span>
          <span class="key ib"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></span>
          <span class="key ib"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg></span>
        </div>
      </div>
      <div class="list" id="list"></div>
      <div class="toast" id="toast"></div>
    </div></div>

    <div class="cap hide" id="cap"><div class="step" id="capstep"></div><h2 id="captitle"></h2><p id="capsub"></p></div>
    <div class="hud" id="hud"></div>

    <div class="outro" id="outro">
      <div class="appicon"><div class="well">›<i></i></div></div>
      <h1>Hatch</h1>
      <p class="tag">Люк в терминал: открыл, выполнил, закрыл.</p>
      <div class="row"><span class="pill main">github.com/3Danger/hatch</span><span class="pill">macOS 26+</span><span class="pill">Бесплатно · MIT</span></div>
    </div>

    <svg class="cursor" id="cursor" viewBox="0 0 22 32"><path d="M2 2v24l6.2-6 4.3 9.6 4-1.8-4.2-9.4H21z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
</div>

<div class="ctl">
  <button type="button" class="primary" id="play">▶ Старт</button>
  <button type="button" id="restart">Сначала</button>
  <div class="bar"><i id="prog"></i></div>
  <p class="hint">Для записи: откройте страницу с <kbd>?rec</kbd> в адресе — кадр займёт всё окно, ролик начнётся сам. Пробел — старт и сначала.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const film = $('film');
const REC = /[?&]rec\b/.test(location.search);
if (REC) document.body.classList.add('rec');

function fit() {
  const box = $('fit').getBoundingClientRect();
  film.style.transform = `scale(${Math.min(box.width / 1600, box.height / 900)})`;
  if (REC) { const s = Math.min(innerWidth / 1600, innerHeight / 900); film.style.transform = `scale(${s})`; film.style.left = (innerWidth - 1600 * s) / 2 + 'px'; film.style.top = (innerHeight - 900 * s) / 2 + 'px' }
}
addEventListener('resize', fit); fit();

const ICON = {
  check: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.2 2.2L9.5 3.5"/></svg>',
  chev: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>',
  plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
  rerun: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>',
  copy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="8.5" height="8.5" rx="1.8"/><path d="M3.5 10.5h-.3A1.7 1.7 0 0 1 1.5 8.8V3.2c0-.9.8-1.7 1.7-1.7h5.6c.9 0 1.7.8 1.7 1.7v.3"/></svg>',
  star: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.9l1.85 3.8 4.15.6-3 2.95.7 4.15L8 11.45 4.3 13.4l.7-4.15-3-2.95 4.15-.6z"/></svg>',
  pin: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6 2h4l-.5 4 2.5 2.5H4L6.5 6zM8 8.5V14"/></svg>',
  trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg>',
};

/* ───── данные ───── */
const LOG = [
  ['a1c9e42', 'fix: popup no longer sticks after cd'],
  ['9b3f0d7', 'feat: folder tree on ⌘P'],
  ['4e7a2c1', 'fix: stage field closes on blur'],
  ['c2d8b55', 'feat: favorite folders and commands'],
  ['71fe3a9', 'docs: install from Releases'],
  ['e5b0c13', 'fix: thinner focus ring'],
  ['3aa9d42', 'feat: search history with ⌘F'],
  ['08c7e6b', 'chore: release workflow'],
];
const FS = { '~/git': ['dotfiles', 'hatch', 'notes', 'website'], '~/git/website': ['public', 'scripts', 'src'] };

/* ───── сцена: исходное состояние ───── */
let gen = 0;
function reset() {
  gen++;
  $('panel').className = 'panel';
  $('outro').className = 'outro';
  $('cap').className = 'cap hide';
  $('hud').innerHTML = '';
  $('toast').className = 'toast';
  $('inbar').className = 'inbar sunk ring';
  $('cursor').style.transition = 'none'; $('cursor').style.left = '1700px'; $('cursor').style.top = '760px';
  requestAnimationFrame(() => $('cursor').style.transition = '');
  setCrumbs(['~', 'git', 'hatch'], false);
  setInput('');
  document.querySelector('.tree')?.remove();
  $('list').innerHTML = `
    <div class="blk sunk" data-k="swift build"><div class="bh"><span class="tri"></span><div class="ttl"><span class="cmd">swift build</span><span class="meta"><span class="dir">hatch</span><span class="tm">12:01</span></span></div>
      <div class="chips"><span class="key bb">${ICON.plus}</span></div><div class="slot"><span class="status ok"><span class="dot">${ICON.check}</span>готово</span></div></div>
      <div class="pv">Building for debugging...\nBuild complete! (4.21s)</div></div>
    <div class="blk sunk" data-k="brew upgrade"><div class="bh"><span class="tri"></span><div class="ttl"><span class="cmd">brew upgrade</span><span class="meta"><span class="dir">~</span><span class="tm">11:47</span></span></div>
      <div class="chips"><span class="key bb">${ICON.plus}</span></div><div class="slot"><span class="status ok"><span class="dot">${ICON.check}</span>готово</span></div></div>
      <div class="pv">==> Upgrading 3 outdated packages\nffmpeg 7.1 -> 7.2, git 2.51 -> 2.52, jq 1.8.1</div></div>`;
  $('prog').style.width = '0';
}
function setCrumbs(parts, fav, lit) {
  $('crumbs').innerHTML = parts.map((p, i) => `${i ? '<span class="sep">›</span>' : ''}<span class="crumb ${lit === p ? 'lit' : ''}" data-c="${p}">${p}</span>`).join('') + `<span class="fav ${fav ? 'on' : ''}">★</span>`;
}
function setInput(text, { ph = 'Введите команду…', caret = true } = {}) {
  $('intext').innerHTML = text ? `<span>${text}</span>${caret ? '<span class="caret"></span>' : ''}` : `${caret ? '<span class="caret" style="margin:0 2px 0 0"></span>' : ''}<span class="ph">${ph}</span>`;
}

/* ───── время ───── */
const SPEED = Number(new URLSearchParams(location.search).get('speed')) || 1;
const TOTAL = 44000;
let t0 = 0;
function wait(ms) { const g = gen; return new Promise((ok, no) => setTimeout(() => g === gen ? ok() : no('stop'), ms / SPEED)) }
function tick() { if (!t0) return; $('prog').style.width = Math.min(100, (performance.now() - t0) * SPEED / TOTAL * 100) + '%'; requestAnimationFrame(tick) }

async function caption(step, title, sub) {
  $('cap').className = 'cap hide'; await wait(300);
  $('capstep').textContent = step; $('captitle').textContent = title; $('capsub').textContent = sub;
  $('cap').className = 'cap';
}
async function keys(list, hold = 650) {
  $('hud').className = 'hud';
  $('hud').innerHTML = list.map(k => `<span class="k">${k}</span>`).join('');
  await wait(140);
  $('hud').querySelectorAll('.k').forEach(k => k.classList.add('down'));
  await wait(160);
  $('hud').querySelectorAll('.k').forEach(k => k.classList.remove('down'));
  await wait(hold);
  $('hud').className = 'hud out';
}
async function type(text, set, cps = 16) {
  for (let i = 1; i <= text.length; i++) { set(text.slice(0, i)); await wait(1000 / cps + (Math.random() * 40 - 20)) }
}
function at(el, dx = 0, dy = 0) {
  const f = film.getBoundingClientRect(), s = f.width / 1600, r = el.getBoundingClientRect();
  return [(r.left - f.left) / s + r.width / 2 + dx, (r.top - f.top) / s + r.height / 2 + dy];
}
async function moveTo(el, dx = 0, dy = 0, ms = 900) {
  const [x, y] = at(el, dx, dy);
  const c = $('cursor'); c.style.transitionDuration = ms / SPEED + 'ms'; c.style.left = x - 3 + 'px'; c.style.top = y - 3 + 'px';
  await wait(ms);
}
async function click(el) {
  $('cursor').classList.add('click'); el && el.classList.add('press');
  await wait(130);
  $('cursor').classList.remove('click'); el && el.classList.remove('press');
}
function toast(text) { $('toast').textContent = text; $('toast').className = 'toast on'; setTimeout(() => $('toast').className = 'toast', 2200 / SPEED) }

/* ───── ролик ───── */
async function film_() {
  // 0. рабочий стол
  await wait(500);
  await caption('Hatch для macOS', 'Терминал по одной клавише', 'Панель открывается поверх любого приложения — как Spotlight, только для команд.');
  await wait(1700);

  // 1. хоткей и команда
  keys(['⌃', 'Space']);
  await wait(320);
  $('panel').classList.add('on'); $('inbar').classList.add('on');
  await wait(900);
  await caption('1 · Запуск', 'Команда — прямо в панели', 'Без окна терминала: вывод остаётся в истории отдельным блоком.');
  await type('git log --oneline -8', v => setInput(v));
  await wait(250);
  keys(['↩'], 400);
  setInput('');
  const blk = document.createElement('div');
  blk.className = 'blk sunk enter'; blk.dataset.k = 'git log';
  blk.innerHTML = `<div class="bh"><span class="tri"></span><div class="ttl"><span class="cmd">git log --oneline -8</span><span class="meta"><span class="dir">hatch</span><span class="tm">12:04</span></span></div>
    <div class="chips" id="chips"></div>
    <div class="slot" id="slot"><span class="status run" id="st"><span class="dot"></span>работает</span>
      <span class="acts">${['rerun', 'copy', 'star', 'pin', 'trash'].map(i => `<span class="key bb">${ICON[i]}</span>`).join('')}</span></div></div>
    <div class="out" id="out"></div>`;
  $('list').prepend(blk);
  // старые блоки — компактнее: превью прячется
  document.querySelectorAll('.blk:not(.enter) .pv').forEach(p => { p.style.transition = 'max-height .4s, opacity .3s, padding .4s'; p.style.maxHeight = '0'; p.style.opacity = '0'; p.style.paddingBlock = '0'; p.style.overflow = 'hidden' });
  await wait(450);
  for (const [h, m] of LOG) {
    $('out').insertAdjacentHTML('beforeend', `<div class="ln"><span class="h">${h}</span> ${m}</div>`);
    await wait(110);
  }
  await wait(250);
  $('st').className = 'status ok'; $('st').innerHTML = `<span class="dot">${ICON.check}</span>готово`;
  $('chips').innerHTML = `<span class="key bb" id="plus">${ICON.plus}</span>`;
  await wait(1500);

  // 2. конвейер
  await caption('2 · Конвейер', 'Фильтр по готовому выводу', 'Шаг grep обрабатывает сохранённый вывод — сама команда не запускается снова.');
  await moveTo(blk.querySelector('.cmd'), 120, 0, 1000);
  blk.querySelector('.bh').classList.add('hover');
  await wait(500);
  await moveTo($('plus'), 4, 4, 650);
  await click($('plus'));
  $('chips').innerHTML = `<span class="stagef" id="stagef"><span class="caret"></span><span class="ph">grep …</span></span>`;
  await wait(350);
  await moveTo(blk.querySelector('.ttl'), -40, 70, 700);
  await type('grep fix', v => $('stagef').innerHTML = `<span>${v}</span><span class="caret"></span>`, 13);
  await wait(250);
  keys(['↩'], 400);
  $('chips').innerHTML = `<span class="chip">grep fix</span><span class="key bb">${ICON.plus}</span>`;
  $('out').querySelectorAll('.ln').forEach(l => {
    if (!l.textContent.includes('fix')) l.classList.add('cut');
    else l.innerHTML = l.innerHTML.replace('fix', '<mark>fix</mark>');
  });
  await wait(700);
  blk.querySelector('.bh').classList.remove('hover');
  await moveTo($('cap'), 200, 300, 900);
  await wait(1300);

  // 3. дерево папок
  await caption('3 · Папки', '⌘P — дерево папок', 'Стрелками по соседним папкам, Enter — перейти, как cd.');
  await wait(400);
  keys(['⌘', 'P']);
  await wait(300);
  setCrumbs(['~', 'git', 'hatch'], false, 'hatch');
  const tree = document.createElement('div'); tree.className = 'tree';
  const lit = $('crumbs').querySelector('[data-c="hatch"]');
  tree.style.left = Math.max(8, lit.offsetLeft - 6) + 'px';
  $('panel').append(tree);
  const T = { focus: '~/git/hatch', open: new Set() };
  const rows = () => { const out = []; for (const n of FS['~/git']) { const p = '~/git/' + n; out.push([p, 0]); if (T.open.has(p)) for (const c of FS[p] || []) out.push([p + '/' + c, 1]) } return out };
  const draw = () => tree.innerHTML = `<div class="up">в <b>~/git</b></div><div class="rows">${rows().map(([p, d]) => {
    const kids = FS[p]?.length, nm = p.split('/').pop();
    return `<div class="trow ${p === T.focus ? 'sel' : ''}" style="padding-left:${4 + d * 16}px"><span class="tw ${kids ? '' : 'leaf'} ${T.open.has(p) ? 'open' : ''}">${ICON.chev}</span><span class="fg"></span>${nm}${p === '~/git/hatch' ? '<span class="cur">текущая</span>' : ''}</div>` }).join('')}</div>
    <div class="foot"><span><span class="kh">→</span> войти</span><span><span class="kh">←</span> выше</span><span><span class="kh">↩</span> перейти</span><span><span class="kh">⌥←→</span> соседняя</span><span><span class="kh">esc</span> закрыть</span></div>`;
  draw();
  await wait(900);
  for (const step of [['↓', () => T.focus = '~/git/notes'], ['↓', () => T.focus = '~/git/website'], ['→', () => T.open.add('~/git/website')], ['→', () => T.focus = '~/git/website/public'], ['↑', () => T.focus = '~/git/website']]) {
    keys([step[0]], 250); await wait(120); step[1](); draw(); await wait(560);
  }
  keys(['↩'], 500);
  await wait(250);
  tree.remove();
  setCrumbs(['~', 'git', 'website'], false);
  await wait(1300);

  // 4. избранное и поиск
  await caption('4 · Избранное и поиск', 'Нужное — под рукой', '⌘D — папка в избранное, ⌘F — поиск по всем командам и их выводу.');
  await wait(300);
  keys(['⌘', 'D']);
  await wait(300);
  setCrumbs(['~', 'git', 'website'], true);
  toast('★ Папка в избранном: website');
  await wait(1700);
  keys(['⌘', 'F']);
  await wait(300);
  $('inbar').classList.add('searching');
  setInput('', { ph: 'Поиск по командам и выводу…' });
  await wait(600);
  await type('Build', v => {
    setInput(v);
    document.querySelectorAll('.blk').forEach(b => b.classList.toggle('gone', v.length >= 3 && b.dataset.k !== 'swift build'));
  }, 9);
  const sb = document.querySelector('[data-k="swift build"]'), pv = sb.querySelector('.pv');
  pv.style.maxHeight = '60px'; pv.style.opacity = '1'; pv.style.paddingBlock = '7px 10px';
  pv.innerHTML = 'Building for debugging...\n<mark class="s" style="background:rgba(255,159,10,.4);color:#fff;border-radius:2px">Build</mark> complete! (4.21s)';
  await wait(1700);
  keys(['esc'], 400);
  $('inbar').classList.remove('searching');
  setInput('');
  document.querySelectorAll('.blk').forEach(b => b.classList.remove('gone'));
  await wait(1100);

  // 5. финал
  $('cap').className = 'cap hide';
  keys(['⌃', 'Space'], 500);
  await wait(300);
  $('panel').classList.remove('on');
  await moveTo(film, 900, 700, 800);
  await wait(400);
  $('outro').classList.add('on');
  await wait(3800);
  window.__done = true; document.title = 'done';
}

async function play() {
  reset(); await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  t0 = performance.now(); tick(); window.__done = false;
  try { await film_() } catch (e) { if (e !== 'stop') throw e }
}
$('play').onclick = play;
$('restart').onclick = play;
addEventListener('keydown', e => { if (e.code === 'Space' && !REC) { e.preventDefault(); play() } });
reset();
if (REC) setTimeout(play, 600);
</script>
